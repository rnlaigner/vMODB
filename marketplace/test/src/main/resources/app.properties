# proxy test - simple app.config

# microservice http URLs
product_host=localhost

# coordinator network options
tcp_port=8091
# default to 0, leading to pick the default network group
network_thread_pool_size=4
network_buffer_size=0
so_buffer_size=0
network_send_timeout=0

# coordinator worker options
num_transaction_workers=1
num_vms_workers=1

# coordinator batch options
num_max_transactions_batch=100000
batch_window_ms=50000000

# simulation
duration=5000

#app=online_marketplace
benchmark=tpcc

# maven shade merging priority
ordinal=101